[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-id-photo"
version = "0.2.0"
description = "Local-first Phase 1 ID portrait feasibility prototype"
requires-python = ">=3.10"
dependencies = ["Pillow>=10,<13", "numpy>=1.26,<3", "opencv-python-headless>=4.10,<5", "PyYAML>=6,<7", "psutil>=6,<8"]

[project.optional-dependencies]
ui = ["gradio>=5.20,<6"]
test = ["pytest>=8,<10", "scikit-image>=0.24,<1"]

[project.scripts]
smart-id-photo = "smart_id_photo.cli:main"
smart-id-photo-ui = "smart_id_photo.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
